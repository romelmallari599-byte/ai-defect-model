<!doctype html>
<html lang="tl">
<head>

</head>
<body>
<title>Fixed &amp; Pinned Column Bases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    /* Layout: full-bleed 3D site view; control card top-left, detail sheet on the right (collapsible bottom sheet on phones) */
    --bg: #c6d0d7;
    --ink: #1a1e21;
    --ink-2: #4a5258;
    --ink-3: #687177;
    --sheet: rgba(243, 244, 241, 0.9);
    --sheet-solid: #f3f4f1;
    --line: rgba(26, 30, 33, 0.14);
    --hivis: #f2c230;
    --hivis-ink: #1a1e21;
    --accent: #8f6200;
    --tag-bg: rgba(248, 248, 245, 0.95);
    --tag-line: rgba(26, 30, 33, 0.72);
    --tag-ring: #1a1e21;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111416; --ink: #e8ebea; --ink-2: #a9b1b5; --ink-3: #848d92;
      --sheet: rgba(19, 22, 25, 0.86); --sheet-solid: #131619; --line: rgba(232, 235, 234, 0.14);
      --accent: #f2c230; --tag-bg: rgba(19, 22, 25, 0.92); --tag-line: rgba(232, 235, 234, 0.78); --tag-ring: #0c0e0f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111416; --ink: #e8ebea; --ink-2: #a9b1b5; --ink-3: #848d92;
    --sheet: rgba(19, 22, 25, 0.86); --sheet-solid: #131619; --line: rgba(232, 235, 234, 0.14);
    --accent: #f2c230; --tag-bg: rgba(19, 22, 25, 0.92); --tag-line: rgba(232, 235, 234, 0.78); --tag-ring: #0c0e0f;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
  #app { position: relative; height: 100%; }
  #stage { position: absolute; inset: 0; z-index: 0; } /* own stacking context: CSS2D labels carry z-indexes */
  .hud, .panel { z-index: 1; }
  #stage canvas { display: block; touch-action: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  .card {
    background: var(--sheet);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    backdrop-filter: blur(12px) saturate(1.15);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(10, 14, 18, 0.12);
  }
  .eyebrow {
    margin: 0; font-family: var(--display); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3);
  }

  /* control card */
  .hud {
    position: absolute; top: 16px; left: 16px;
    width: 336px; max-width: calc(100% - 32px);
    padding: 14px 16px 14px; display: grid; gap: 12px;
  }
  .hud h1 {
    margin: 2px 0 0; font-family: var(--display); font-weight: 700; font-size: 27px;
    line-height: 1.02; letter-spacing: 0.005em; text-wrap: balance;
  }
  .ctrls { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
  .seg { display: contents; }
  .toggles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .seg-label {
    font-family: var(--display); font-weight: 600; font-size: 11px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .seg-btns { display: inline-flex; justify-self: start; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg-btns button, .btn {
    appearance: none; border: 0; background: transparent; color: var(--ink); cursor: pointer;
    font: 600 13px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase;
    padding: 8px 10px;
  }
  .seg-btns button + button { border-left: 1px solid var(--line); }
  .seg-btns button:hover, .btn:hover { background: rgba(127, 127, 127, 0.12); }
  .seg-btns button[aria-pressed="true"] { background: var(--hivis); color: var(--hivis-ink); }
  .btn { border: 1px solid var(--line); border-radius: 7px; }
  .btn[aria-pressed="true"] { background: var(--hivis); color: var(--hivis-ink); border-color: transparent; }
  .chk {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font: 600 13px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase;
  }
  .chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--hivis); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { margin: 0; font-size: 12px; color: var(--ink-3); }

  /* detail sheet */
  .panel {
    position: absolute; top: 16px; right: 16px; bottom: 16px; width: 372px;
    overflow: auto; padding: 18px 20px 20px; overscroll-behavior: contain;
  }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .panel h2 {
    margin: 4px 0 0; font-family: var(--display); font-weight: 700; font-size: 32px;
    line-height: 1; text-wrap: balance;
  }
  .panel-toggle { display: none; }
  .panel-body { display: grid; gap: 0; }
  .lede { margin: 12px 0 16px; font-size: 15px; line-height: 1.5; }
  .panel h3 {
    margin: 20px 0 9px; font-family: var(--display); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3);
  }
  .restraint {
    display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: center;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
  }
  .sym { width: 104px; height: 78px; color: var(--ink); display: block; }
  .dof { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .dof li {
    font-family: var(--mono); font-size: 12px; padding: 4px 7px; border-radius: 5px;
    border: 1px solid var(--ink); font-variant-numeric: tabular-nums;
  }
  .dof li.fix { background: var(--ink); color: var(--sheet-solid); }
  .dof li.free { border-style: dashed; border-color: var(--accent); color: var(--accent); }
  .reac { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
  .testnote {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.45;
    background: rgba(242, 194, 48, 0.16); border: 1px solid rgba(242, 194, 48, 0.55);
  }
  .notes { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 14px; line-height: 1.45; }
  .notes li::marker { color: var(--accent); }
  .specs { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; font-size: 13.5px; }
  .specs dt { color: var(--ink-2); }
  .specs dd {
    margin: 0; text-align: right; font-family: var(--mono); font-size: 12.5px;
    font-variant-numeric: tabular-nums; min-width: 0;
  }
  .fine { margin: 18px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-3); }

  /* 3D callouts */
  .tag { position: absolute; width: 0; height: 0; font-family: var(--body); }
  .tag-dot {
    position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--hivis); box-shadow: 0 0 0 1.5px var(--tag-ring);
  }
  .tag-lead { position: absolute; left: 0; top: 0; height: 1px; background: var(--tag-line); transform-origin: 0 0; }
  .tag-pill {
    position: absolute; transform: translate(0, -50%); white-space: nowrap;
    background: var(--tag-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 8px 5px; font-size: 12px; line-height: 1.25; font-weight: 600;
    box-shadow: 0 2px 8px rgba(10, 14, 18, 0.14);
  }
  .tag-pill small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-2); }
  .tag-l .tag-pill { transform: translate(-100%, -50%); }

  #loading {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
    background: var(--bg); transition: opacity 0.6s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading p { margin: 0; font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }

  @media (max-width: 820px) {
    .hud { right: 16px; width: auto; max-width: none; padding: 12px 14px; gap: 10px; }
    .hud .eyebrow, .hud .hint, .hud .seg-label { display: none; }
    .hud h1 { font-size: 21px; }
    .ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
    .seg { display: flex; }
    .toggles { gap: 8px 12px; }
    .seg-btns button, .btn { padding: 7px 8px; font-size: 12px; }
    .panel { top: auto; left: 16px; right: 16px; width: auto; max-height: 46%; padding: 14px 16px; }
    .panel h2 { font-size: 24px; }
    .panel-toggle { display: inline-flex; }
    .panel.collapsed .panel-body { display: none; }
    .tag-pill { font-size: 11px; padding: 3px 6px 4px; }
    .tag-pill small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loading { transition: none; }
  }
</style>

<div id="app">
  <div id="stage" aria-label="3D view of the column base. Drag to orbit, scroll or pinch to zoom."></div>

  <header class="hud card">
    <div>
      <p class="eyebrow">Foundation support · 3D site model</p>
      <h1>Fixed &amp; Pinned Column Bases</h1>
    </div>
    <div class="ctrls">
      <div class="seg">
        <span class="seg-label" id="lbl-type">Column</span>
        <div class="seg-btns" data-key="type" role="group" aria-labelledby="lbl-type">
          <button type="button" id="b-rc" data-v="rc">Concrete</button>
          <button type="button" id="b-steel" data-v="steel">Steel</button>
        </div>
      </div>
      <div class="seg">
        <span class="seg-label" id="lbl-sup">Support</span>
        <div class="seg-btns" data-key="support" role="group" aria-labelledby="lbl-sup">
          <button type="button" id="b-fixed" data-v="fixed">Fixed</button>
          <button type="button" id="b-pinned" data-v="pinned">Pinned</button>
        </div>
      </div>
      <div class="seg">
        <span class="seg-label" id="lbl-view">View</span>
        <div class="seg-btns" data-key="view" role="group" aria-labelledby="lbl-view">
          <button type="button" id="b-solid" data-v="solid">Solid</button>
          <button type="button" id="b-cut" data-v="cut">Cutaway</button>
          <button type="button" id="b-xray" data-v="xray">X-ray</button>
        </div>
      </div>
      <div class="seg">
        <span class="seg-label" id="lbl-cam">Camera</span>
        <div class="seg-btns" id="cams" role="group" aria-labelledby="lbl-cam">
          <button type="button" id="c-overview" data-cam="overview">Overview</button>
          <button type="button" id="c-base" data-cam="base">Base</button>
          <button type="button" id="c-footing" data-cam="footing">Footing</button>
        </div>
      </div>
      <div class="seg">
        <span class="seg-label">Show</span>
        <div class="toggles">
          <label class="chk" for="soil"><input type="checkbox" id="soil" checked> Lupa</label>
          <label class="chk" for="labels"><input type="checkbox" id="labels" checked> Labels</label>
          <button type="button" class="btn" id="test" aria-pressed="false">Rotation test</button>
        </div>
      </div>
    </div>
    <p class="hint">I-drag para umikot · scroll o pinch para mag-zoom · right-drag o two-finger drag para mag-pan</p>
  </header>

  <aside class="panel card" id="panel" aria-live="polite">
    <div class="panel-head">
      <div>
        <p class="eyebrow" id="p-eyebrow">Detail</p>
        <h2 id="p-title">Loading</h2>
      </div>
      <button type="button" class="btn panel-toggle" id="p-toggle" aria-expanded="true" aria-controls="p-body">Details</button>
    </div>
    <div class="panel-body" id="p-body"></div>
  </aside>

  <div id="loading"><p id="loading-msg">Inihahanda ang site…</p></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3;
const $ = (s) => document.querySelector(s);
const setMsg = (t) => { $('#loading-msg').textContent = t; };
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ */
/* Procedural noise (tileable)                                        */
/* ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makePerlin(seed) {
  const rnd = mulberry32(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const gx = new Float32Array(256), gy = new Float32Array(256);
  for (let i = 0; i < 256; i++) { const a = rnd() * Math.PI * 2; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  return (x, y, px, py) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py;
    const x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
    const a = perm[perm[x0] + y0], b = perm[perm[x1] + y0], c = perm[perm[x0] + y1], d = perm[perm[x1] + y1];
    const n00 = gx[a] * xf + gy[a] * yf, n10 = gx[b] * (xf - 1) + gy[b] * yf;
    const n01 = gx[c] * xf + gy[c] * (yf - 1), n11 = gx[d] * (xf - 1) + gy[d] * (yf - 1);
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const top = n00 + (n10 - n00) * u, bot = n01 + (n11 - n01) * u;
    return (top + (bot - top) * v) * 1.4;
  };
}
function fbm(n, u, v, px, py, oct) {
  let s = 0, a = 1, t = 0;
  for (let o = 0; o < oct; o++) { s += a * n(u * px, v * py, px, py); t += a; a *= 0.5; px *= 2; py *= 2; }
  return s / t;
}

/* ------------------------------------------------------------------ */
/* Renderer, scene, camera                                            */
/* ------------------------------------------------------------------ */
const stage = $('#stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  setMsg('Walang WebGL sa browser na ito, kaya hindi ma-render ang 3D view.');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = 'labels';
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.03, 1000);
camera.position.set(4.35, 1.75, 4.95);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.35;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.56;
controls.target.set(0, -0.45, 0);

/* ------------------------------------------------------------------ */
/* Texture helpers                                                    */
/* ------------------------------------------------------------------ */
function rgbaCanvas(w, h, data) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(data, w, h), 0, 0);
  return c;
}
function canvasTex(canvas, srgb) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
// tangent-space normal map from a wrapped height field (canvas rows run down, uv.v runs up)
function normalFromHeight(H, w, h, k) {
  const out = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) {
    const ym = ((y - 1 + h) % h) * w, yp = ((y + 1) % h) * w, yr = y * w;
    for (let x = 0; x < w; x++) {
      const xm = (x - 1 + w) % w, xp = (x + 1) % w;
      const dx = (H[yr + xp] - H[yr + xm]) * k, dy = (H[yp + x] - H[ym + x]) * k;
      const inv = 1 / Math.sqrt(dx * dx + dy * dy + 1), i = (yr + x) * 4;
      out[i] = (-dx * inv * 0.5 + 0.5) * 255;
      out[i + 1] = (dy * inv * 0.5 + 0.5) * 255;
      out[i + 2] = (inv * 0.5 + 0.5) * 255;
      out[i + 3] = 255;
    }
  }
  return out;
}

/* Formed concrete: plywood-cast surface, 1.2 m per tile */
function genConcrete() {
  const N = 1024, H = new Float32Array(N * N), C = new Uint8ClampedArray(N * N * 4), R = new Uint8ClampedArray(N * N * 4);
  const n1 = makePerlin(3), n2 = makePerlin(7), n3 = makePerlin(13), n4 = makePerlin(17), rnd = mulberry32(5);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const u = x / N, v = y / N, i = y * N + x;
      const blot = fbm(n1, u, v, 3, 3, 5);
      const mid = fbm(n2, u, v, 16, 16, 3);
      const fine = n3(u * 128, v * 128, 128, 128);
      const streak = fbm(n4, u, v, 20, 2, 3);
      const wn = rnd() - 0.5;
      H[i] = 0.14 * mid + 0.12 * fine + 0.22 * wn;
      const g = 0.6 * (1 + 0.15 * blot + 0.045 * mid + 0.03 * fine + 0.035 * wn + 0.03 * streak);
      C[i * 4] = g * 255; C[i * 4 + 1] = g * 252; C[i * 4 + 2] = g * 243; C[i * 4 + 3] = 255;
      R[i * 4] = 255; R[i * 4 + 1] = (0.86 + 0.06 * mid + 0.05 * wn) * 255; R[i * 4 + 2] = 0; R[i * 4 + 3] = 255;
    }
  }
  // bug holes (surface air voids)
  for (let k = 0; k < 380; k++) {
    const cx = Math.floor(rnd() * N), cy = Math.floor(rnd() * N), r = 0.7 + Math.pow(rnd(), 3) * 3.4, r2 = r * r, R0 = Math.ceil(r);
    for (let dy = -R0; dy <= R0; dy++) for (let dx = -R0; dx <= R0; dx++) {
      const d2 = dx * dx + dy * dy; if (d2 > r2) continue;
      const x = (cx + dx + N) % N, y = (cy + dy + N) % N, i = y * N + x, f = Math.sqrt(1 - d2 / r2);
      H[i] -= 2.4 * f;
      const dk = 1 - 0.4 * f; C[i * 4] *= dk; C[i * 4 + 1] *= dk; C[i * 4 + 2] *= dk;
    }
  }
  return {
    map: canvasTex(rgbaCanvas(N, N, C), true),
    normal: canvasTex(rgbaCanvas(N, N, normalFromHeight(H, N, N, 1.1)), false),
    rough: canvasTex(rgbaCanvas(N, N, R), false),
  };
}

/* Sawn section: mortar + coarse aggregate, 0.35 m per tile */
function genSection() {
  const N = 1024, rnd = mulberry32(21);
  const c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
  const hc = document.createElement('canvas'); hc.width = hc.height = N; const h = hc.getContext('2d');
  g.fillStyle = '#9d9a90'; g.fillRect(0, 0, N, N);
  h.fillStyle = '#6e6e6e'; h.fillRect(0, 0, N, N);
  const pal = [[116, 111, 103], [140, 133, 121], [168, 158, 140], [92, 94, 97], [152, 143, 128], [124, 115, 105], [180, 171, 155], [84, 80, 76], [134, 121, 104]];
  const CELL = 64, GN = N / CELL, grid = Array.from({ length: GN * GN }, () => []);
  const radii = [];
  for (let k = 0; k < 3400; k++) radii.push(5 + 30 * Math.pow(rnd(), 2.4));

/* Deformed bar: 2 longitudinal ribs + inclined transverse ribs + mill scale/rust.

  for (let y = 0; y < Hh; y++) {
    const v = y / Hh;

      const dL = Math.min(Math.abs(v - 0.25), Math.abs(v - 0.75));
      const hL = Math.exp(-((dL / 0.02) ** 2));
      const side = v > 0.25 && v < 0.75 ? 0 : 1;
      const local = side === 0 ? (v - 0.25) / 0.5 : ((v + 0.25) % 1) / 0.5;
      const taper = Math.pow(Math.max(0, Math.sin(Math.PI * local)), 0.5);

      label([-0.02, FT + 0.025, 0.2], 'Throat 130 mm', 'the only concrete that crosses', 'c', [-66, -30]);
      label([0.19, FT + 0.025, 0], 'Joint filler + sealant', 'lets the base rotate', 'c', [70, 34]);
      label([0.0585, -0.8, 0.072], 'Crossed bars', 'Mesnager hinge, 6 – 20 mmØ', 'r', [-78, 4]);
      label([0.14, -0.95, 0.14], 'Bars stop 50 mm above joint', '', 'r', [60, -44]);
      label([0.18, -1.11, 0.1], 'Bursting mesh', '2 layers 10 mmØ', 'r', [46, 42], true);
    }
    bend.uY0.value = fixed ? FT : FT + 0.025;
  } else {
    const fixed = state.support === 'fixed';
    const pTop = fixed ? 0.29 : 0.272, half = fixed ? 0.25 : 0.175;
    solid(chamfered(0.375, 0.02), FT, 0.2, mats.col);
    solid(sq(half + 0.05), 0.2, 0.25, mats.grout);
    colBars(0.305, 0.1017).forEach(([x, z, hx, hz]) => rebar.push(bar([[x, 0.15, z], [x, Y_HOOK, z], [x + hx * 0.24, Y_HOOK, z + hz * 0.24]], 0.02, 0.06)));
    const ties = [0.13, 0.08, 0.03];
    for (let y = -0.12; y >= -1.01; y -= 0.15) ties.push(y);
    ties.push(-1.15, -1.25);
    ties.forEach((y, i) => rebar.push(tie(0.32, y, i % 4)));

    paint.push(prism(sq(half), 0.25, pTop, 'y', 1 / 0.6));
    paint.push(hSection(0.25, 0.25, 0.009, 0.014, 0.013, pTop, 2.4));
    const wr = fixed ? 0.0058 : 0.0048, o = wr * 0.55, yw = pTop + o;
    const weld = (a, b) => welds.push(sweep([new V3(...a), new V3(...b)], wr, 8, 0.03));
    for (const sx of [-1, 1]) {
      weld([sx * (0.125 + o), yw, -0.125], [sx * (0.125 + o), yw, 0.125]);
      for (const sz of [-1, 1]) {
        weld([sx * (0.111 - o), yw, sz * 0.018], [sx * (0.111 - o), yw, sz * 0.125]);
        weld([sx * 0.111, yw, sz * (0.125 + o)], [sx * 0.125, yw, sz * (0.125 + o)]);
      }
    }
    for (const sz of [-1, 1]) weld([-0.098, yw, sz * (0.0045 + o)], [0.098, yw, sz * (0.0045 + o)]);

    if (fixed) {
      for (const sx of [-1, 1]) for (const zc of [-0.119, 0, 0.119]) {
        const poly = [[0.14, pTop], [0.24, pTop], [0.24, pTop + 0.05], [0.125, pTop + 0.2], [0.125, pTop + 0.015]].map(([x, y]) => [sx * x, y]);
        paint.push(prism(poly, zc - 0.006, zc + 0.006, 'z', 1 / 0.6));
        for (const sz of [-1, 1]) {
          const zz = zc + sz * (0.006 + o);
          weld([sx * (0.125 + o), pTop + 0.016, zz], [sx * (0.125 + o), pTop + 0.2, zz]);
          weld([sx * 0.14, yw, zz], [sx * 0.24, yw, zz]);
        }
      }
      for (const x of [-0.19, 0.19]) for (const z of [-0.19, -0.065, 0.065, 0.19]) {
        bolts.push(rod(x, -0.45, 0.352, z, 0.012));
        bolts.push(prism(rect(x - 0.04, x + 0.04, z - 0.04, z + 0.04), -0.44, -0.428));
        bolts.push(hexNut(x, -0.428, z, 0.036, 0.022));
        bolts.push(hexNut(x, 0.218, z, 0.036, 0.022), disc(x, 0.24, z, 0.025, 0.004));
        bolts.push(prism(rect(x - 0.035, x + 0.035, z - 0.035, z + 0.035), pTop, pTop + 0.012));
        bolts.push(hexNut(x, pTop + 0.012, z, 0.036, 0.022));
        bolts.push(...threads(x, pTop + 0.036, 0.35, z, 0.0122));
      }
      label([0.125, 1.5, 0.06], 'H 250 × 250 × 9 × 14', 'red oxide primer', 's', [56, -20]);
      label([0.25, 0.27, 0.13], 'Base plate 40 mm', '500 × 500', 's', [90, -6]);
      label([0.2, 0.37, 0.119], 'Stiffener plate 12 mm', '6 pcs, welded to flange + plate', 's', [58, -46]);
      label([0.19, 0.335, 0.19], '8 – M24 anchor bolts', 'plate washer + nut', 's', [-30, -95]);
      label([0.1282, pTop + 0.003, -0.06], 'Fillet weld', 'all around the column', 's', [-110, 10], true);
      label([0.3, 0.225, 0], 'Non-shrink grout', '50 mm', 'c', [80, 52], true);
      label([0.19, -0.43, 0.19], 'Anchor plate + nut', 'embed ≈650 mm', 'r', [-64, 30], true);
      label([0.19, 0.229, 0.065], 'Leveling nut', 'inside the grout', 'r', [-80, 40], true);
    } else {
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        const x = sx * 0.065, z = sz * 0.07;
        bolts.push(bar([[x, 0.314, z], [x, -0.25, z], [x + sx * 0.12, -0.25, z]], 0.02, 0.04));
        bolts.push(hexNut(x, 0.222, z, 0.03, 0.018), disc(x, 0.24, z, 0.02, 0.004));
        bolts.push(disc(x, pTop, z, 0.022, 0.004), hexNut(x, pTop + 0.004, z, 0.03, 0.018));
        bolts.push(...threads(x, pTop + 0.024, 0.312, z, 0.0102));
      }
      label([0.125, 1.5, 0.06], 'H 250 × 250 × 9 × 14', 'red oxide primer', 's', [56, -20]);
      label([0.175, 0.261, 0.1], 'Base plate 22 mm', '350 × 350, walang stiffener', 's', [90, -6]);
      label([0.065, 0.305, 0.07], '4 – M20 anchor bolts', 'malapit sa web', 's', [-30, -95]);
      label([0.1282, pTop + 0.003, -0.06], 'Fillet weld', 'all around the column', 's', [-110, 10], true);
      label([0.225, 0.225, 0], 'Non-shrink grout', '50 mm', 'c', [80, 52], true);
      label([0.15, -0.25, 0.07], 'L-bolt hook', 'embed ≈450 mm', 'r', [-60, 34], true);
    }
    label([0.375, -0.35, 0], 'RC pedestal 750 × 750', 'top 200 mm above grade', 'c', [56, -8]);
    label([0.32, 0.08, 0.2], '3 ties @ 50 mm', 'confine the anchor bolts', 'r', [60, -30], true);
    bend.uY0.value = pTop;
  }

  const add = (geos, mat) => {
    if (!geos.length) return;
    const m = new THREE.Mesh(mergeGeometries(geos), mat);
    m.castShadow = m.receiveShadow = true; cfg.add(m);
  };
  add(rebar, M.rebar); add(bolts, M.galv); add(paint, M.paint); add(welds, M.weld); add(spacers, M.lean);
  const tw = new THREE.TorusGeometry(0.017, 0.0011, 5, 18), im = new THREE.InstancedMesh(tw, M.wire, wires.length);
  const q = new THREE.Quaternion(), m4 = new THREE.Matrix4(), one = new V3(1, 1, 1), zAxis = new V3(0, 0, 1);
  wires.forEach(([x, y, z, k], i) => { q.setFromUnitVectors(zAxis, new V3(1, 0, k ? 1 : -1).normalize()); m4.compose(new V3(x, y, z), q, one); im.setMatrixAt(i, m4); });
  cfg.add(im);
  scene.add(cfg);

  bend.uMode.value = state.support === 'fixed' ? 0 : 1;
  bend.uL.value = (state.type === 'rc' ? 1.2 : 2.4) - bend.uY0.value;
  applyView();
}

function applyView() {
  const v = state.view;
  for (const s of solids) {
    s.full.visible = v !== 'cut';
    s.full.material = v === 'xray' ? M.xray : s.formed;
    s.full.castShadow = v !== 'xray';
    s.cut.visible = v === 'cut';
    s.edges.visible = v === 'xray';
  }
  for (const l of labels) l.userData.on = state.labels && !(l.userData.kind === 'r' && v === 'solid');
  updateLabels();
}
// fine-detail callouts only appear once the camera is close enough to read them
function updateLabels() {
  for (const l of labels) l.visible = l.userData.on && (!l.userData.detail || camera.position.distanceTo(l.position) < 2.5);
}
function applySoil() {
  site.soil.visible = site.ground.visible = state.soil;
  site.floor.visible = !state.soil;
}

function symbol(fixed) {
  const hatch = (y, x0, x1) => { let s = ''; for (let x = x0 + 4; x <= x1; x += 8) s += `<line x1="${x}" y1="${y}" x2="${x - 8}" y2="${y + 9}"/>`; return s; };
  return fixed
    ? `<svg class="sym" viewBox="0 0 104 78" aria-hidden="true"><g stroke="currentColor" fill="none" stroke-linecap="round"><line x1="52" y1="6" x2="52" y2="50" stroke-width="7"/><line x1="18" y1="50" x2="86" y2="50" stroke-width="2.6"/><g stroke-width="1.4">${hatch(50, 18, 86)}</g></g></svg>`
    : `<svg class="sym" viewBox="0 0 104 78" aria-hidden="true"><g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="52" y1="6" x2="52" y2="31" stroke-width="7"/><circle cx="52" cy="35" r="4.5" stroke-width="2.6" fill="none"/><path d="M52 39.5 L39 58 H65 Z" stroke-width="2.6" fill="none"/><line x1="28" y1="58" x2="76" y2="58" stroke-width="2.6"/><g stroke-width="1.4">${hatch(58, 28, 76)}</g></g></svg>`;
}
function renderPanel() {
  const fixed = state.support === 'fixed', d = INFO[`${state.type}-${state.support}`];
  $('#p-eyebrow').textContent = d.eyebrow;
  $('#p-title').textContent = d.title;
  $('#p-body').innerHTML = `
    <p class="lede">${d.lede}</p>
    <div class="restraint">
      ${symbol(fixed)}
      <div>
        <ul class="dof">
          <li class="fix">ΔX = 0</li><li class="fix">ΔY = 0</li>
          <li class="${fixed ? 'fix' : 'free'}">${fixed ? 'θ = 0' : 'θ ≠ 0, free'}</li>
        </ul>
        <p class="reac">${fixed ? '3 reactions: R<sub>x</sub>, R<sub>y</sub>, M' : '2 reactions: R<sub>x</sub>, R<sub>y</sub>. Walang moment (M = 0).'}</p>
      </div>
    </div>
    ${state.test ? `<p class="testnote"><strong>Rotation test (exaggerated):</strong> ${d.test}</p>` : ''}
    <h3>Ano ang makikita mo</h3>

}

/* ------------------------------------------------------------------ */
/* Camera presets + UI                                                */
/* ------------------------------------------------------------------ */
const CAMS = {
  rc: { overview: [[4.35, 1.75, 4.95], [0, 0.0, 0]], base: [[1.3, -0.5, 1.5], [0, -1.12, 0]], footing: [[1.85, -0.35, 2.15], [0, -1.33, 0]] },
  steel: { overview: [[4.4, 2.2, 5.0], [0, 0.3, 0]], base: [[1.3, 0.95, 1.5], [0, 0.28, 0]], footing: [[1.9, 0.05, 2.25], [0, -0.62, 0]] },
};
let tween = null;
function flyTo(name, instant = false) {
  state.cam = name;
  const [p, t] = CAMS[state.type][name];
  // portrait screens have a narrow horizontal field of view, so back the camera off
  const k = camera.aspect >= 1 ? 1 : Math.min(1.6, Math.pow(1 / camera.aspect, 0.55));
  const to = { t: new V3(...t) };
  to.p = new V3(...p).sub(to.t).multiplyScalar(k).add(to.t);
  if (instant || reduceMotion) { camera.position.copy(to.p); controls.target.copy(to.t); tween = null; }
  else tween = { p0: camera.position.clone(), t0: controls.target.clone(), ...to, start: performance.now(), dur: 1100 };
  syncButtons();
}
function syncButtons() {
  document.querySelectorAll('.seg-btns[data-key]').forEach((g) => g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(state[g.dataset.key] === b.dataset.v))));
  document.querySelectorAll('#cams button').forEach((b) => b.setAttribute('aria-pressed', String(state.cam === b.dataset.cam)));
  $('#test').setAttribute('aria-pressed', String(state.test));
}
function setState(key, v) {
  if (state[key] === v) return;
  const prevType = state.type;
  state[key] = v;
  if (key === 'type' || key === 'support') {
    build(); renderPanel();
    if (key === 'type' && prevType !== v) flyTo(state.cam);
  }
  if (key === 'view') {
    if (v === 'xray' && state.soil) { state.soil = false; $('#soil').checked = false; applySoil(); }
    applyView();
  }
  syncButtons();
}
document.querySelectorAll('.seg-btns[data-key]').forEach((g) => g.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (b) setState(g.dataset.key, b.dataset.v);
}));
$('#cams').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) flyTo(b.dataset.cam); });
$('#soil').addEventListener('change', (e) => { state.soil = e.target.checked; applySoil(); });
$('#labels').addEventListener('change', (e) => { state.labels = e.target.checked; applyView(); });
$('#test').addEventListener('click', () => { state.test = !state.test; testT = 0; syncButtons(); renderPanel(); });
$('#p-toggle').addEventListener('click', () => {
  const p = $('#panel'), open = p.classList.toggle('collapsed') === false;
  $('#p-toggle').setAttribute('aria-expanded', String(open));
});
controls.addEventListener('start', () => { tween = null; });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  if (w > 820) {
    const left = $('.hud').offsetWidth + 16, right = w - $('#panel').offsetWidth - 16;
    camera.setViewOffset(w, h, Math.round(w / 2 - (left + right) / 2), 0, w, h);
  }
  else camera.setViewOffset(w, h, 0, -Math.round($('.hud').offsetHeight * 0.3), w, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let testT = 0;
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (tween) {
    const k = Math.min(1, (performance.now() - tween.start) / tween.dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p, e); controls.target.lerpVectors(tween.t0, tween.t, e);
    if (k >= 1) tween = null;
  }
  if (state.test) { testT += dt; bend.uA.value = 0.14 * Math.sin(testT * 1.7); }
  else bend.uA.value = Math.abs(bend.uA.value) < 1e-4 ? 0 : bend.uA.value * 0.86;
  controls.update();
  updateLabels();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

async function init() {
  setMsg('Naghahalo ng concrete…'); await nextFrame(); T.conc = genConcrete();
  setMsg('Pinuputol ang aggregate…'); await nextFrame(); T.sec = genSection();
  setMsg('Binabaluktot ang bakal…'); await nextFrame(); T.rebar = genRebar(); T.paint = genPaint(); T.filler = genFiller();
  setMsg('Naghuhukay ng lupa…'); await nextFrame(); T.soil = genSoilWall(); T.ground = genGround();
  makeMaterials();
  buildSite();
  build();
  applySoil();
  renderPanel();
  if (window.innerWidth <= 820) { $('#panel').classList.add('collapsed'); $('#p-toggle').setAttribute('aria-expanded', 'false'); }
  resize();
  flyTo('overview', true);
  renderer.setAnimationLoop(loop);
  await nextFrame();
  $('#loading').classList.add('done');
  window.__ready = true;
}
init().catch((err) => { console.error(err); setMsg('Nagka-error sa pag-load ng 3D view: ' + err.message); });
